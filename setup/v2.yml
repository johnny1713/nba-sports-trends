# V2 量化系統的唯一 workflow（請手動複製到 .github/workflows/v2.yml）
# - 手動觸發：選 job（backfill / backtest / test / daily）與參數
# - 排程：每天跑 daily；nba_quant.jobs 在 V2 啟用前會直接略過，不會產生任何輸出
name: NBA V2 Quant

on:
  schedule:
    - cron: '47 12 * * *'    # 台灣 20:47
    - cron: '47 15 * * *'    # 台灣 23:47
  workflow_dispatch:
    inputs:
      job:
        description: 'backfill / backtest / test / daily'
        required: true
        default: 'test'
        type: choice
        options: [test, backfill, backtest, daily]
      args:
        description: '額外參數，例如 --season 2025'
        required: false
        default: ''

concurrency:
  group: v2-quant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - name: Install
        run: pip install -r requirements-v2.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run job
        if: ${{ github.event_name == 'schedule' || inputs.job != 'test' }}
        env:
          JOB: ${{ github.event_name == 'schedule' && 'daily' || inputs.job }}
          ARGS: ${{ inputs.args }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m nba_quant.jobs "$JOB" $ARGS
      - name: Commit outputs
        if: ${{ github.event_name == 'schedule' || inputs.job != 'test' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models_store v2 docs/reports 2>/dev/null || true
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "V2: ${JOB:-daily} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
        env:
          JOB: ${{ inputs.job }}
